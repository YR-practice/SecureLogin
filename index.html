<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авторизація — Шифрування даних</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center">
  <div class="card">
    <h1 id="title">Увійти</h1>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Вхід</button>
      <button class="tab" id="tabReg" type="button">Реєстрація</button>
    </div>

    <!-- ВХІД -->
    <div id="loginBox">
      <label for="lLogin">Логін</label>
      <input type="text" id="lLogin" autocomplete="username">
      <label for="lPass">Пароль</label>
      <input type="password" id="lPass" autocomplete="current-password">
      <label class="check"><input type="checkbox" id="showLPass"> Показати пароль</label>
      <label class="check"><input type="checkbox" id="isAdmin"> Увійти як адміністратор</label>
      <button class="btn" id="btnLogin" type="button">Увійти</button>
    </div>

    <!-- РЕЄСТРАЦІЯ -->
    <div id="regBox" class="hidden">
      <label for="rName">ПІБ</label>
      <input type="text" id="rName">
      <label for="rEmail">Email</label>
      <input type="email" id="rEmail">
      <label for="rLogin">Логін</label>
      <input type="text" id="rLogin">
      <label for="rPass">Пароль (мін. 6 символів)</label>
      <input type="password" id="rPass">
      <label for="rPass2">Повторіть пароль</label>
      <input type="password" id="rPass2">
      <label class="check"><input type="checkbox" id="showRPass"> Показати паролі</label>
      <button class="btn" id="btnReg" type="button">Зареєструватися</button>
    </div>

    <div class="msg" id="msg"></div>
    <p class="hint">Адміністратор: <code>admin</code> / <code>Admin@2026</code> (позначте «Увійти як адміністратор»).</p>
  </div>
</div>

<script src="js/crypto.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
